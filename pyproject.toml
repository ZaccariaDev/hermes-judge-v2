[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-judge-v2"
version = "2.0.0"
description = "Evidence-driven autonomous goal controller for Hermes Agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-judge-v2 = "hermes_judge_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

